<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog fixture</title>
<style>
  body { margin: 0 auto; max-width: 700px; font: 16px/1.6 system-ui, sans-serif; padding: 16px; }
  dialog::backdrop { background: rgb(0 0 0 / 0.45); }
  dialog { width: 360px; height: 220px; }
</style></head>
<body>
<h1>Dialog fixture</h1>
<p>Page text under a native modal dialog.</p>
<p style="height: 1600px">Long filler block so the page scrolls.</p>
<dialog id="d">Sign up for updates</dialog>
<script>document.getElementById('d').showModal();</script>
</body>
</html>
