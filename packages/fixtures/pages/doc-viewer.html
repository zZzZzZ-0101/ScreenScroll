<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Doc viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.4 Arial, sans-serif; }
  /* The file list behind, only on the right, like a drive folder seen through the preview. */
  #list { position: absolute; top: 0; bottom: 0; left: 55%; right: 0; overflow: hidden; background: #fff; }
  #list p { margin: 0; padding: 14px; border-bottom: 1px solid #ddd; }
  #shade { position: fixed; inset: 0; background: rgba(32, 33, 36, 0.86); }
  #toolbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #202124; color: #fff;
    display: flex; align-items: center; padding: 0 16px; }
  /* The viewer scrolls; sheets sit left of centre with dark gaps, like the screenshot. */
  #viewer { position: fixed; top: 56px; bottom: 0; left: 0; right: 0; overflow-y: auto; }
  .sheet { background: #fff; width: 760px; height: 1075px; margin: 18px 0 18px 140px; padding: 60px 64px;
    box-sizing: border-box; overflow: hidden; }
  .sheet h2 { margin: 0 0 16px; font-size: 18px; text-align: center; }
  .sheet table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  .sheet th { background: #222; color: #fff; padding: 6px; }
  .sheet td { border: 1px solid #000; padding: 6px; vertical-align: top; }
  .foot { position: absolute; }
</style></head>
<body>
<div id="list"></div>
<div id="shade"></div>
<div id="toolbar">Answer Scheme.pdf · Page 1 / 6</div>
<div id="viewer"></div>
<script>
  const list = document.getElementById('list');
  for (let i = 1; i <= 30; i++) list.insertAdjacentHTML('beforeend', `<p>Folder file ${i}.pdf</p>`);
  const viewer = document.getElementById('viewer');
  const para = (n) =>
    Array.from({ length: n }, (_, i) => `Line ${i + 1} of the answer scheme, with enough words to wrap across the sheet.`).join(' ');
  for (let i = 1; i <= 6; i++) {
    viewer.insertAdjacentHTML(
      'beforeend',
      `<div class="sheet"><h2>Document page ${i}</h2><p>${para(12)}</p>` +
        (i === 3
          ? `<table><tr><th>From the text</th><th>Answer</th></tr><tr><td>${para(4)}</td><td>${para(6)}</td></tr></table>`
          : `<p>${para(18)}</p>`) +
        `<p style="margin-top:40px">End of document page ${i}.</p></div>`,
    );
  }
</script>
</body>
</html>
