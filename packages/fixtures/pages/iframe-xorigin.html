<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cross-origin iframe fixture</title>
<style> body { margin: 0 auto; max-width: 760px; font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
iframe { width: 100%; height: 400px; border: 1px solid #aaa; } </style></head>
<body data-expect='{"warning": "embedded frame"}'>
<h1>Cross-origin iframe fixture</h1>
<p>The frame below comes from a second local port, so the page can't read it.</p>
<iframe src="http://localhost:5178/article.html" title="other origin"></iframe>
<p>A same-origin frame is readable and must not warn.</p>
<iframe src="article.html" title="same origin"></iframe>
<p>End.</p>
</body>
</html>
