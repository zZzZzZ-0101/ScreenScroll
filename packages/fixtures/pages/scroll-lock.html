<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scroll lock fixture</title>
<style>
  /* What sites do while a dialog is open: lock scrolling on html and body. */
  html, body { overflow: hidden; height: 100%; }
  body { margin: 0 auto; max-width: 700px; font: 16px/1.5 system-ui, sans-serif; padding: 0 16px; }
  .block { height: 700px; border-bottom: 4px solid #0e7c7b; }
</style>
</head>
<body data-expect='{"fullHeight": 3500}'>
<h1>Scroll lock fixture</h1>
<div class="block">Block 1</div>
<div class="block">Block 2</div>
<div class="block">Block 3</div>
<div class="block">Block 4</div>
<div class="block">Block 5</div>
<p id="end">END OF LOCKED PAGE</p>
</body>
</html>
